---
- import_playbook: preflight.yml

- name: Configure routers one at a time
  hosts: routeros
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  tasks:
    - name: Add the inter-router address
      community.routeros.command:
        commands:
          - "/ip address add address={{ lab_link_address }} interface={{ lab_link_interface }} comment={{ lab_comment }}"
      when: lab_plan.actions.link_address
      changed_when: true
    - name: Add the loopback address
      community.routeros.command:
        commands:
          - "/ip address add address={{ lab_loopback_address }} interface={{ lab_loopback_interface }} comment={{ lab_comment }}"
      when: lab_plan.actions.loopback_address
      changed_when: true
    - name: Add the route to the peer loopback
      community.routeros.command:
        commands:
          - "/ip route add dst-address={{ lab_peer_loopback }}/32 gateway={{ lab_peer_gateway }} comment={{ lab_comment }}"
      when: lab_plan.actions.route
      changed_when: true
    - name: Read the current router identity
      community.routeros.command:
        commands:
          - ':put [/system identity get name]'
      register: lab_current_identity
      changed_when: false
    - name: Set the router identity
      community.routeros.command:
        commands:
          - "/system identity set name={{ lab_identity }}"
      when: lab_current_identity.stdout[0] | trim != lab_identity
      changed_when: true
    - name: Reset the connection after the identity check
      ansible.builtin.meta: reset_connection
    - name: Verify the resulting identity
      community.routeros.command:
        commands:
          - ':put [/system identity get name]'
      register: lab_new_identity
      changed_when: false
      failed_when: lab_new_identity.stdout[0] | trim != lab_identity
    - name: Read the resulting addresses and routes
      community.routeros.command:
        commands:
          - ':put [:serialize to=json [/ip address print as-value]]'
          - ':put [:serialize to=json [/ip route print as-value]]'
          - ':put [:serialize to=json [/interface print as-value]]'
      register: lab_applied_state
      changed_when: false
    - name: Validate the resulting configuration
      ansible.builtin.set_fact:
        lab_verified_plan: >-
          {{ (lab_applied_state.stdout[0] | from_json)
             | lab_plan_router_state(lab_applied_state.stdout[1] | from_json,
                                     lab_applied_state.stdout[2] | from_json,
                                     {'link_interface': lab_link_interface,
                                      'loopback_interface': lab_loopback_interface,
                                      'link_address': lab_link_address,
                                      'loopback_address': lab_loopback_address,
                                      'peer_loopback': lab_peer_loopback,
                                      'peer_gateway': lab_peer_gateway}) }}
    - name: Require all requested addresses and routes
      ansible.builtin.assert:
        that:
          - lab_verified_plan.errors | length == 0
          - not lab_verified_plan.actions.link_address
          - not lab_verified_plan.actions.loopback_address
          - not lab_verified_plan.actions.route
        fail_msg: "The router did not apply all requested settings: {{ lab_verified_plan }}"
