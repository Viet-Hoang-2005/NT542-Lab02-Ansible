---
- import_playbook: init.yml

- name: Check the Ansible control node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require a compatible Ansible Core
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.20', '>=')
          - ansible_version.full is version('2.21', '<')
        fail_msg: Activate the lab venv with Ansible Core 2.20.x before proceeding.
    - name: Check the SSH dependency
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", -c, 'import pylibsshext']
      changed_when: false
    - name: Check the installed collections
      ansible.builtin.command:
        argv: [ansible-galaxy, collection, list]
      register: lab_collections
      changed_when: false
    - name: Require the planned collection versions
      ansible.builtin.assert:
        that:
          - lab_collections.stdout is search('community\\.routeros\\s+3\\.23\\.0')
          - lab_collections.stdout is search('ansible\\.netcommon\\s+8\\.7\\.1')
          - lab_collections.stdout is search('ansible\\.utils\\s+6\\.1\\.1')
        fail_msg: Install the pinned collections from requirements.yml.

- name: Check both routers before configuration
  hosts: routeros
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read RouterOS version and current configuration state
      community.routeros.command:
        commands:
          - /system resource print
          - ':put [:serialize to=json [/ip address print as-value .proplist=address,interface,comment]]'
          - ':put [:serialize to=json [/ip route print as-value .proplist=dst-address,gateway,comment]]'
          - ':put [:serialize to=json [/interface print as-value .proplist=name]]'
      register: lab_state
      changed_when: false
    - name: Require RouterOS 7.16.1
      ansible.builtin.assert:
        that:
          - lab_state.stdout[0] is search('version:\\s*7\\.16\\.1(?:\\s|$)')
        fail_msg: The lab was tested for RouterOS 7.16.1; inspect compatibility before proceeding.
    - name: Check addresses, routes and required interfaces
      ansible.builtin.set_fact:
        lab_plan: >-
          {{ (lab_state.stdout[1] | from_json)
             | lab_plan_router_state(lab_state.stdout[2] | from_json,
                                     lab_state.stdout[3] | from_json,
                                     {'link_interface': lab_link_interface,
                                      'loopback_interface': lab_loopback_interface,
                                      'link_address': lab_link_address,
                                      'loopback_address': lab_loopback_address,
                                      'peer_loopback': lab_peer_loopback,
                                      'peer_gateway': lab_peer_gateway}) }}
    - name: Stop on configuration conflicts
      ansible.builtin.assert:
        that:
          - lab_plan.errors | length == 0
        fail_msg: "{{ lab_plan.errors | join('; ') }}"
    - name: Show the planned additions
      ansible.builtin.debug:
        var: lab_plan.actions
