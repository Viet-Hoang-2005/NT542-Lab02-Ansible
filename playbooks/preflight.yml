---
- import_playbook: init.yml

- name: Check the Ansible control node
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check controller prerequisites
      ansible.builtin.import_role:
        name: preflight
        tasks_from: controller.yml
- name: Check both routers before configuration
  hosts: routeros
  gather_facts: false
  tasks:
    - name: Check router prerequisites
      ansible.builtin.import_role:
        name: preflight
        tasks_from: routers.yml
- name: Enforce all-router readiness for a standalone preflight
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Enforce router readiness
      ansible.builtin.import_role:
        name: preflight
        tasks_from: enforce.yml
