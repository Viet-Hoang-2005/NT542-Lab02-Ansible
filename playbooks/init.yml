---
- name: Initialize a shared run on the control node
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # 1. Sinh mã định danh lượt chạy (Run ID) theo giờ Việt Nam (UTC+7) định dạng: YYYY-MM-DD_HH-mm-ss
    - name: Initialize the Vietnam time run ID
      ansible.builtin.set_fact:
        lab_run_id: "{{ lab_run_id | default(lookup('pipe', \"TZ='Asia/Ho_Chi_Minh' date +%Y-%m-%d_%H-%M-%S\")) }}"
        lab_project_dir: "{{ hostvars[groups['routeros'][0]].inventory_dir }}"
    - name: Validate the run ID
      ansible.builtin.assert:
        that:
          - lab_run_id is match('^[A-Za-z0-9][A-Za-z0-9_.-]*$')
    - name: Create the artifact directory
      ansible.builtin.file:
        path: "{{ lab_project_dir }}/artifacts/{{ lab_run_id }}"
        state: directory
        mode: '0700'
