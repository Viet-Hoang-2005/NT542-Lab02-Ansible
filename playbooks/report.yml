---
- import_playbook: init.yml

- name: Produce a report from the saved measurements
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    lab_artifact_dir: "{{ lab_project_dir }}/artifacts/{{ lab_run_id }}"
  tasks:
    - name: Run lab_report role
      ansible.builtin.import_role:
        name: lab_report
