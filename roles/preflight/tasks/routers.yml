---
- name: Check the router and record any preflight failure
  block:
    # 1. Trích xuất thông tin phần cứng và cấu hình mạng hiện tại dưới dạng cấu trúc JSON
    - name: Read RouterOS version and current configuration state
      community.routeros.command:
        commands:
          - /system resource print
          - ':put [:serialize to=json [/ip address print as-value]]'
          - ':put [:serialize to=json [/ip route print as-value]]'
          - ':put [:serialize to=json [/interface print as-value]]'
      register: lab_state
      ignore_unreachable: true
      changed_when: false

    # 2. Xác thực phiên SSH đã kết nối thành công tới thiết bị
    - name: Require a successful SSH connection
      ansible.builtin.assert:
        that:
          - not (lab_state.unreachable | default(false))
        fail_msg: The router could not be reached over SSH.

    - name: Extract the RouterOS version
      ansible.builtin.set_fact:
        lab_routeros_version: >-
          {{ lab_state.stdout[0] | regex_findall('version: *([0-9][0-9A-Za-z._-]*)') | first | default('') }}

    - name: Require a tested RouterOS version
      ansible.builtin.assert:
        that:
          - lab_routeros_version | length > 0
          - lab_routeros_version in lab_tested_routeros_versions
        fail_msg: "RouterOS version '{{ lab_routeros_version | default('unknown', true) }}' is not in the tested list: {{ lab_tested_routeros_versions | join(', ') }}."

    # 4. Sử dụng Custom Filter Plugin (lab_plan_router_state) để so sánh trạng thái hiện tại với cấu hình mong muốn
    # Xác định các hành động cần thực hiện (actions) và phát hiện các lỗi xung đột (errors)
    - name: Check addresses, routes and required interfaces
      ansible.builtin.set_fact:
        lab_plan: >-
          {{ (lab_state.stdout[1] | from_json)
             | lab_plan_router_state(lab_state.stdout[2] | from_json,
                                     lab_state.stdout[3] | from_json,
                                     {'link_interface': lab_link_interface,
                                      'loopback_interface': lab_loopback_interface,
                                      'link_address': lab_link_address,
                                      'loopback_address': lab_loopback_address,
                                      'peer_loopback': lab_peer_loopback,
                                      'peer_gateway': lab_peer_gateway}) }}

    # 5. Dừng thực thi nếu phát hiện xung đột địa chỉ IP trùng lặp, thiếu cổng mạng hoặc sai gateway
    - name: Stop on configuration conflicts
      ansible.builtin.assert:
        that:
          - lab_plan.errors | length == 0
        fail_msg: "{{ lab_plan.errors | join('; ') }}"

    # 6. Đánh dấu router này đã vượt qua preflight thành công
    - name: Mark the router as ready
      ansible.builtin.set_fact:
        lab_preflight_ok: true
        lab_preflight_error: null

    # 7. Hiển thị danh sách các tác vụ cấu hình dự kiến sẽ được áp dụng
    - name: Show the planned additions
      ansible.builtin.debug:
        var: lab_plan.actions

  # Khối rescue: Nếu có bất kỳ lỗi nào xảy ra trong block, ghi nhận lại trạng thái mà không làm crash playbook
  rescue:
    - name: Record the preflight failure
      ansible.builtin.set_fact:
        lab_preflight_ok: false
        lab_preflight_error: "{{ ansible_failed_result.msg | default('Preflight failed.') }}"
